    <meta name="color-scheme" content="light dark">
    <script>
      /* Pre-paint the chosen impression before any CSS lands, so the page
         never flashes the wrong theme. Mirrors assets/js/theme.js. */
      (function () {
        try {
          var t = localStorage.getItem("lphie-theme");
          if (t !== "light" && t !== "dark") {
            t = (window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches) ? "dark" : "light";
          }
          document.documentElement.setAttribute("data-theme", t);
        } catch (e) {}
      })();
    </script>
